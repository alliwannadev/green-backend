server:
  port: 8080
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  profiles:
    active: local
  application:
    name: core-api
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  metrics:
    tags:
      application:
        ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: prometheus

# 기본적으로 P6Spy 비활성화
decorator:
  datasource:
    enabled: false
